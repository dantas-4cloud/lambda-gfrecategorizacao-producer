name: PR Develop to Feature-Flag

on:
  pull_request:
    branches:
      - feature-flag
    types:
      - closed

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr-to-main:
    name: Create PR Feature-Flag to Main
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: feature-flag
          fetch-depth: 0
      
      - name: Get Version from Tag
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "Previous tag: ${LATEST_TAG}"
      
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ github.token }}
          commit-message: "chore: prepare release ${{ steps.version.outputs.tag }}"
          title: "[PROD] Release ${{ steps.version.outputs.tag }} - from feature-flag"
          body: |
            ## Release to Production
            
            **Version**: ${{ steps.version.outputs.tag }}
            **Source**: feature-flag
            **Target**: main
            
            ### Changes
            - Automated release from feature-flag branch
            - Ready for production deployment
            
            **Required approvals**: 2
          branch: release/${{ steps.version.outputs.tag }}
          base: main
          labels: "release,automated"
