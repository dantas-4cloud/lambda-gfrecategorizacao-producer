name: Deploy - Development

on:
  workflow_dispatch: # Trigger manual
  push:
    branches: [develop]

env:
  AWS_REGION: us-east-2
  ENVIRONMENT: dev
  TF_VERSION: 1.6.0

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to Dev
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest tests/ -v --cov=src --cov-fail-under=80

      - name: Build Lambda Package
        run: |
          mkdir -p package
          cd src
          pip install -r ../requirements.txt -t ../package/ --quiet
          cp *.py ../package/
          cd ../package
          zip -r ../lambda_function.zip . -q
          cd ..
          mv lambda_function.zip infra/
          echo "✓ Lambda package created at infra/lambda_function.zip"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::366476833548:role/github-actions-deploy
          aws-region: us-east-2

      - name: Terraform Format Check
        run: |
          cd infra
          terraform fmt -check -recursive .

      - name: Terraform Init
        run: |
          cd infra
          terraform init -backend=false

      - name: Terraform Validate
        run: |
          cd infra
          terraform validate

      - name: Terraform Plan
        run: |
          cd infra
          terraform plan \
            -var-file="environments/dev.tfvars" \
            -out=tfplan \
            -input=false

      - name: Terraform Apply
        run: |
          cd infra
          terraform apply -no-color -input=false tfplan

      - name: Get Lambda URL
        run: |
          cd infra
          terraform output -json lambda_function_url | jq -r '.' > lambda_url.txt
          echo "Lambda URL:"
          cat lambda_url.txt

      - name: Smoke Test
        run: |
          LAMBDA_URL=$(cat lambda_url.txt)
          curl -X POST "$LAMBDA_URL" \
            -H "Content-Type: application/json" \
            -d '{"test": "dev-deployment"}' \
            --fail --silent

      - name: Summary
        run: |
          echo "✅ Dev deployment completed successfully"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Region: ${{ env.AWS_REGION }}"
