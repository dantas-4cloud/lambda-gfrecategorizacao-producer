name: Deploy Production (Main)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
    types:
      - opened
      - synchronize
  workflow_dispatch:  # Permite trigger manual

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  ci:
    name: Run CI Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests
        run: |
          pytest tests/ -v --cov=src --cov-fail-under=80 --tb=short
  
  terraform-plan:
    name: Terraform Plan (PROD)
    needs: ci
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1
      
      - name: Terraform Format Check
        run: |
          cd terraform
          terraform fmt -check -recursive .
      
      - name: Terraform Init
        run: |
          cd terraform
          terraform init -backend=false
      
      - name: Terraform Plan
        run: |
          cd terraform
          terraform plan \
            -var-file="environments/prod.tfvars" \
            -out=prod.tfplan \
            -input=false
      
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: prod-terraform-plan
          path: terraform/prod.tfplan
  
  approval:
    name: Manual Approval
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Wait for approval
        run: |
          echo "Waiting for manual approval to deploy to PROD..."
          echo "This job requires manual approval in GitHub Actions"
  
  deploy:
    name: Deploy to Production
    needs: approval
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: prod-terraform-plan
          path: terraform/
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1
      
      - name: Terraform Init
        run: |
          cd terraform
          terraform init -backend=false
      
      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply \
            -no-color \
            -input=false \
            prod.tfplan
      
      - name: Wait for Lambda Warmup
        run: sleep 30
      
      - name: Run Smoke Tests
        run: |
          python -m pytest tests/unit/test_lambda_handler.py -v
      
      - name: Verify CloudWatch Logs
        run: |
          aws logs describe-log-groups \
            --log-group-name-prefix "/aws/lambda/recategorization-producer" \
            --region us-east-1
      
      - name: Create GitHub Release
        if: success()
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: prod-${{ github.sha }}
          release_name: Production Deployment - ${{ github.sha }}
          body: |
            Production deployment completed successfully.
            
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref }}
          draft: false
          prerelease: false
