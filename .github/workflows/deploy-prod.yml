name: Deploy - Production

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-2
  ENVIRONMENT: prod
  TF_VERSION: 1.6.0

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: |
          pytest tests/ -v --cov=src --cov-fail-under=80

  terraform-plan:
    name: Plan Terraform
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Build Lambda Package
        run: |
          python -m pip install --upgrade pip --quiet
          mkdir -p package
          cd src
          pip install -r ../requirements.txt -t ../package/ --quiet
          cp *.py ../package/
          cd ../package
          zip -r ../lambda_function.zip . -q
          cd ..
          mv lambda_function.zip infra/
          echo "✓ Lambda package created at infra/lambda_function.zip"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Validation
        run: |
          cd infra
          terraform fmt -check -recursive .
          terraform init -backend=false
          terraform validate

      - name: Terraform Plan
        run: |
          cd infra
          terraform plan \
            -var-file="environments/prod.tfvars" \
            -out=tfplan \
            -input=false

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: prod-tfplan
          path: infra/tfplan

  approval:
    name: Manual Approval
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: production

    steps:
      - run: |
          echo "⏳ Awaiting manual approval for production deployment..."
          echo "Review the terraform plan before approving"

  deploy:
    name: Deploy to Production
    needs: approval
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: prod-tfplan
          path: infra/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          cd infra
          terraform init -backend=false

      - name: Terraform Apply
        run: |
          cd infra
          terraform apply -no-color -input=false tfplan

      - name: Lambda Warmup
        run: sleep 30

      - name: Get Lambda Info
        run: |
          cd infra
          echo "Lambda ARN: $(terraform output -raw lambda_function_arn)"
          echo "Lambda URL: $(terraform output -raw lambda_function_url)"
          echo "Log Group: $(terraform output -raw cloudwatch_log_group_name)"

      - name: Health Check
        run: |
          LAMBDA_URL=$(cd infra && terraform output -raw lambda_function_url)
          echo "Testing Lambda at: $LAMBDA_URL"
          curl -s -X POST "$LAMBDA_URL" \
            -H "Content-Type: application/json" \
            -d '{"test": "prod-deployment"}' \
            -w "\nStatus: %{http_code}\n"

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: prod-${{ github.sha }}
          release_name: Release ${{ github.sha }}
          body: |
            Production deployment completed
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref }}
          draft: false
          prerelease: false
