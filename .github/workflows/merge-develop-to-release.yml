name: Merge Develop to Release

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --cov=src --cov-fail-under=80
      - run: cd terraform && terraform fmt -check -recursive . && terraform validate

  pr-develop-to-release:
    needs: tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Create PR develop → release/feature-flag
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: merge develop into release/feature-flag"
          title: "[HOM] Merge develop into release/feature-flag"
          body: "Automated PR after successful CI."
          branch: merge/develop-to-release-${{ github.run_number }}
          base: release/feature-flag
          labels: homolog,automated
