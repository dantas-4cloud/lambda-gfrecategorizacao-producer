name: Deploy Homolog (Feature-Flag)

on:
  push:
    branches:
      - feature-flag
  pull_request:
    branches:
      - feature-flag
    types:
      - opened
      - synchronize

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  ci:
    name: Run CI Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests
        run: |
          pytest tests/ -v --cov=src --cov-fail-under=80
  
  terraform-plan:
    name: Terraform Plan (HOM)
    needs: ci
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1
      
      - name: Terraform Format Check
        run: |
          cd terraform
          terraform fmt -check -recursive .
      
      - name: Terraform Init
        run: |
          cd terraform
          terraform init -backend=false
      
      - name: Terraform Plan
        run: |
          cd terraform
          terraform plan \
            -var-file="environments/hom.tfvars" \
            -out=hom.tfplan \
            -input=false
      
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: hom-terraform-plan
          path: terraform/hom.tfplan
  
  deploy:
    name: Deploy to Homolog
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: homolog
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: hom-terraform-plan
          path: terraform/
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1
      
      - name: Terraform Init
        run: |
          cd terraform
          terraform init -backend=false
      
      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply \
            -no-color \
            -input=false \
            hom.tfplan
      
      - name: Run Post-Deploy Tests
        run: |
          python -m pytest tests/ -v
