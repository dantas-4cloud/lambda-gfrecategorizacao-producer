name: CI Pipeline

on:
  push:
    branches:
      - feature/**
  pull_request:
    branches:
      - develop

env:
  PYTHON_VERSION: '3.12'

permissions:
  contents: write
  pull-requests: write

jobs:
  python-tests:
    name: 🧪 Python Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - run: ruff check src/ tests/
      - run: mypy src/ --ignore-missing-imports --no-error-summary || true
      - run: pytest tests/ -v --cov=src --cov-fail-under=80

  terraform-validation:
    name: 🔧 Terraform Validation
    runs-on: ubuntu-latest
    needs: python-tests
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0
      
      - run: cd terraform && terraform fmt -check -recursive .
      - run: cd terraform && terraform init -backend=false && terraform validate
      - uses: terraform-linters/setup-tflint@v3
      - run: cd terraform && tflint --init && tflint

  pr-feature-to-develop:
    name: 📝 PR feature → develop
    runs-on: ubuntu-latest
    needs: [python-tests, terraform-validation]

    if: |
      startsWith(github.ref, 'refs/heads/feature/') &&
      needs.python-tests.result == 'success' &&
      needs.terraform-validation.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Sanitize branch name
        id: sanitize
        run: |
          CLEAN=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          echo "clean=$CLEAN" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: automated PR from feature to develop"
          title: "🔄 Merge ${{ github.ref_name }} into develop"
          body: "Automated PR after successful CI."
          branch: automated-pr/${{ steps.sanitize.outputs.clean }}-${{ github.run_number }}
          base: develop
          labels: automated
