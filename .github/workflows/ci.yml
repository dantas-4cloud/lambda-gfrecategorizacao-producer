name: CI Pipeline

on:
  push:
    branches:
      - develop
      - feature/**
      - feature-flag
  pull_request:
    branches:
      - develop

env:
  PYTHON_VERSION: '3.12'

permissions:
  contents: write
  pull-requests: write

jobs:
  python-tests:
    name: 🧪 Python Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run linting with ruff
        run: |
          ruff check src/ tests/
      
      - name: Run type checking with mypy
        run: |
          mypy src/ --ignore-missing-imports --no-error-summary || true
      
      - name: Run tests with pytest
        run: |
          pytest tests/ \
            -v \
            --cov=src \
            --cov-report=html \
            --cov-report=term-missing \
            --cov-fail-under=80

  terraform-validation:
    name: 🔧 Terraform Validation
    runs-on: ubuntu-latest
    needs: python-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0
      
      - name: Terraform Format Check
        run: |
          cd terraform
          terraform fmt -check -recursive .
      
      - name: Terraform Init & Validate
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate
      
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v3
      
      - name: TFLint - Check
        run: |
          cd terraform
          tflint --init
          tflint

  # ---------------------------------------------------------
  # 1️⃣ PR automático: feature/* → develop
  # ---------------------------------------------------------
  pr-feature-to-develop:
    name: 📝 PR feature → develop
    runs-on: ubuntu-latest
    needs: [python-tests, terraform-validation]

    if: |
      startsWith(github.ref, 'refs/heads/feature/') &&
      needs.python-tests.result == 'success' &&
      needs.terraform-validation.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sanitize branch name
        id: sanitize-feature
        run: |
          SANITIZED=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          echo "sanitized_branch=$SANITIZED" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: automated PR from feature to develop"
          title: "🔄 Merge ${{ github.ref_name }} into develop"
          body: "Automated PR after successful CI."
          branch: automated-pr/${{ steps.sanitize-feature.outputs.sanitized_branch }}-${{ github.run_number }}
          base: develop
          labels: automated

  # ---------------------------------------------------------
  # 2️⃣ PR automático: develop → feature-flag
  # ---------------------------------------------------------
  pr-develop-to-feature-flag:
    name: 📝 PR develop → feature-flag
    runs-on: ubuntu-latest
    needs: [python-tests, terraform-validation]

    if: |
      github.ref == 'refs/heads/develop' &&
      needs.python-tests.result == 'success' &&
      needs.terraform-validation.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: automated PR from develop to feature-flag"
          title: "🔄 Merge develop into feature-flag"
          body: "Automated PR after successful CI."
          branch: automated-pr/develop-to-feature-flag-${{ github.run_number }}
          base: feature-flag
          labels: automated

  # ---------------------------------------------------------
  # 3️⃣ PR automático: feature-flag → main
  # ---------------------------------------------------------
  pr-feature-flag-to-main:
    name: 📝 PR feature-flag → main
    runs-on: ubuntu-latest
    needs: [python-tests, terraform-validation]

    if: |
      github.ref == 'refs/heads/feature-flag' &&
      needs.python-tests.result == 'success' &&
      needs.terraform-validation.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: automated PR from feature-flag to main"
          title: "🔄 Merge feature-flag into main"
          body: "Automated PR after successful CI."
          branch: automated-pr/feature-flag-to-main-${{ github.run_number }}
          base: main
          labels: automated
